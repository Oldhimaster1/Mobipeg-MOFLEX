name: Native portable packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease tag to upload tested packages to
        required: false
        type: string
  push:
    tags: ['native-v*']

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, label: linux-x86_64}
          - {os: windows-2022, label: windows-x86_64}
          - {os: macos-15-intel, label: macos-x86_64}
          - {os: macos-15, label: macos-arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MOBIPEG_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew list pkgconf || brew install pkgconf
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          update: true
          install: >-
            make diffutils perl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: Build Linux encoder
        if: runner.os == 'Linux'
        run: bash native/BUILD_FOR_LINUX.sh
      - name: Build macOS encoder
        if: runner.os == 'macOS'
        run: bash native/BUILD_FOR_MAC.command
      - name: Build Windows encoder
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash native/BUILD_FOR_WINDOWS.sh
      - name: Native tests
        working-directory: native
        run: python -m unittest discover -s V15 -p test_studio.py -v
      - name: Install packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Package and test portable executable
        run: python scripts/package-native.py --output "${{ runner.temp }}/mobipeg-packages"
      - uses: actions/upload-artifact@v4
        with:
          name: MobiPEG-${{ matrix.label }}
          path: ${{ runner.temp }}/mobipeg-packages/*
          if-no-files-found: error

      - name: Upload tested package to prerelease
        if: startsWith(github.ref, 'refs/tags/native-v') || github.event.inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/mobipeg-packages/* --clobber
